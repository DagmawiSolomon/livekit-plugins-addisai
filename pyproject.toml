[project]
name = "livekit-plugins-addisai"
version = "0.1.1"
description = "AddisAI STT and TTS plugin for LiveKit Agents"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28.1",
    "livekit-agents>=1.5.1",
    "miniaudio>=1.2",
]

[project.urls]
Homepage = "https://github.com/DagmawiSolomon/livekit-plugins-addisai.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]
